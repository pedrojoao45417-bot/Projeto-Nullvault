
name: Auditoria de seguranca

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar analisadores
        run: python -m pip install bandit semgrep

      - name: Executar Bandit
        run: bandit -r . -x ./tests

      - name: Executar Semgrep
        run: semgrep scan --config auto --error .
